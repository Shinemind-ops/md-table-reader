<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD 表格閱讀器</title>
<style>
:root {
  --bg: #0f1115;
  --panel: #171a21;
  --panel2: #1e222b;
  --border: #2a2f3a;
  --text: #d6dae3;
  --text-dim: #8b93a3;
  --accent: #4da3ff;
  --accent-dim: #2a5f99;
  --header-bg: #232834;
  --hover: #252b38;
  --stripe: #161a21;
}
[data-theme="light"] {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --panel2: #f0f2f5;
  --border: #d5dae2;
  --text: #1c2028;
  --text-dim: #677084;
  --accent: #1a6ed8;
  --accent-dim: #bcd7f7;
  --header-bg: #e8ebf1;
  --hover: #eef1f6;
  --stripe: #fafbfc;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
html { overflow: auto; }   /* 視口級滾動（主人 2026-08-17）：表格突破視口 → 瀏覽器視窗橫向滾動（中鍵 autoscroll） */
body {
  font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: block;      /* block：子項溢出撐開視口滾動範圍（flex 會鎖死交叉軸寬度） */
  width: auto;         /* 不要 max-content（會 = 內容最大寬爆炸）——表格溢出即可 */
  overflow: visible;   /* body 不當滾動容器——滾動歸 html 視口級 */
}
header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex-shrink: 0;
  position: sticky;   /* 頁面滾動時 header 固定（主人 2026-08-17） */
  top: 0;
  z-index: 50;
}
header h1 {
  font-size: 16px;
  font-weight: 600;
  margin-right: 6px;
  white-space: nowrap;
}
#fileName {
  color: var(--text-dim);
  font-size: 13px;
  max-width: 320px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
button {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: var(--hover); border-color: var(--accent-dim); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-dim); }
#searchBox {
  flex: 1;
  min-width: 160px;
  max-width: 420px;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
}
#searchBox:focus { outline: none; border-color: var(--accent); }
#stats { font-size: 12px; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
main {
  flex: 1;
  overflow: visible;   /* 不當滾動容器——垂直/水平滾動全歸視口級（主人 2026-08-17） */
  padding: 16px;
}
#dropZone {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed var(--border);
  border-radius: 12px;
  text-align: center;
  color: var(--text-dim);
  font-size: 18px;
  line-height: 2;
  transition: border-color .2s, background .2s;
}
#dropZone.dragover {
  border-color: var(--accent);
  background: var(--panel);
  color: var(--accent);
}
#dropZone.has-file { border-style: none; display: block; padding: 0; }
.table-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
/* 單表格時填滿視窗；多表格時按內容自然高度（避免小表格佔滿留白） */
.table-section.single { min-height: 100%; }
.table-toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--panel2);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex-shrink: 0;
}
.table-title { font-weight: 600; font-size: 14px; }
.table-rows { font-size: 12px; color: var(--text-dim); }
.table-toolbar .spacer { flex: 1; }
.view-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.table-wrap {
  overflow: visible;   /* 不吞滾動——表格溢出到視口級（主人 2026-08-17：不是容器內滾動） */
  width: auto;         /* 不要 max-content（會 = 內容最大寬，100 萬 px 爆炸）——寬度撐滿，表格溢出即可 */
  position: relative;
}
table.md-table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;          /* 初始填滿容器 */
  min-width: 100%;
  table-layout: fixed;  /* fixed：欄寬嚴格按 style.width（拖寬時 JS 設表格總寬 = 欄寬和，純加法） */
  font-size: 13px;
}
.md-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--header-bg);
  color: var(--text);
  font-weight: 600;
  text-align: center; /* 欄標題置中（主人 2026-08-19） */
  padding: 8px 10px;
  border-bottom: 2px solid var(--accent-dim);
  border-right: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: normal;      /* 自動換行（功能②——主人 2026-08-19） */
  word-break: break-word;
  overflow: visible;
}
.md-table th:hover { background: var(--hover); }
.md-table th .arrow { font-size: 11px; margin-left: 4px; color: var(--accent); }
.md-table th .resizer {
  position: absolute;
  right: 0;
  top: 0;
  width: 5px;
  height: 100%;
  cursor: col-resize;
  z-index: 3;
}
.md-table th { position: relative; cursor: grab; }
.md-table th:active { cursor: grabbing; }
.md-table th.drag-over { border-left: 3px solid var(--accent); border-right: 3px solid var(--accent); }
.md-table th.dragging { opacity: 0.5; }
.md-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  white-space: normal;      /* 自動換行（功能②——主人 2026-08-19） */
  word-break: break-word;
  overflow: visible;
  vertical-align: top;
  max-width: 0;
}
.md-table tbody tr:nth-child(even) { background: var(--stripe); }
.md-table tbody tr:hover { background: var(--hover); }
.md-table tr.frozen-first th:first-child,
.md-table.frozen-first td:first-child {
  position: sticky;
  left: 0;
  background: var(--header-bg);
  z-index: 1;
  box-shadow: 1px 0 0 var(--border);
}
.md-table.frozen-first td:first-child { background: var(--panel2); }
.md-table.frozen-first tbody tr:nth-child(even) td:first-child { background: var(--stripe); }
.md-table.frozen-first tbody tr:hover td:first-child { background: var(--hover); }

/* 卡片視圖（Notion 數據庫風） */
.card-view {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
  padding: 14px;
  flex: 1;
  overflow-y: auto;
  align-content: start;
}
.card-view.show { display: grid; }
.card {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.card .card-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}
.card .card-row {
  display: flex;
  gap: 8px;
  font-size: 12px;
  padding: 2px 0;
}
.card .card-row .k {
  color: var(--text-dim);
  flex-shrink: 0;
  min-width: 90px;
  max-width: 40%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card .card-row .v { word-break: break-all; color: var(--text); }
.table-wrap.hide { display: none; }

/* 欄位控制面板 */
.col-panel {
  position: absolute;
  top: 44px;
  right: 14px;
  z-index: 20;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  padding: 10px;
  min-width: 220px;
  max-height: 60vh;
  overflow-y: auto;
  display: none;
}
.col-panel.show { display: block; }
.col-panel .panel-title {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}
.col-panel label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 6px;
  font-size: 13px;
  cursor: pointer;
  border-radius: 4px;
  white-space: nowrap;
}
.col-panel label:hover { background: var(--hover); }
.col-panel input[type="checkbox"] { accent-color: var(--accent); }
.col-panel .panel-foot {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}
.col-panel .panel-foot button { font-size: 12px; padding: 3px 8px; }

/* 篩選面板（Notion 式——主人 2026-08-19 功能①）
   body 級 fixed：顯示不受目標表格大小影響（表格縮小→面板不被裁切，主人 2026-08-19 罵正） */
.filter-panel {
  position: fixed;
  top: 44px;
  left: 14px;
  z-index: 100;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  padding: 10px;
  min-width: 320px;
  max-width: 500px;
  max-height: 60vh;
  overflow-y: auto;
  display: none;
}
.filter-panel.show { display: block; }
.filter-panel .filter-title {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-panel .filter-close {
  margin-left: auto;
  cursor: pointer;
  font-size: 14px;
  padding: 0 4px;
  border-radius: 4px;
  color: var(--text-dim);
}
.filter-panel .filter-close:hover { color: var(--accent); background: var(--hover); }
.filter-cond {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
}
.filter-cond select, .filter-cond input[type="text"] {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 6px;
  font-size: 12px;
}
.filter-cond select { flex: 0 0 auto; max-width: 120px; }
.filter-cond input[type="text"] { flex: 1; min-width: 70px; }
.filter-cond .cond-del {
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
}
.filter-cond .cond-del:hover { color: var(--accent); }
.filter-panel .filter-foot {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
  align-items: center;
}
.filter-panel .filter-foot button { font-size: 12px; padding: 3px 8px; }
.filter-panel .filter-count { font-size: 11px; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* 自動換行開關（主人 2026-08-19：閱讀者想換就換、不想換就截斷） */
body.wrap-off .md-table th,
body.wrap-off .md-table td {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: normal;
}

/* 彈出式卡片（功能④——點擊表格項目彈出完整卡片） */
.row-card-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
}
.row-card-overlay.show { display: flex; }
.row-card-box {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  max-width: 560px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 16px 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.row-card-box h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  word-break: break-all;
}
.row-card-row {
  display: flex;
  gap: 10px;
  font-size: 13px;
  padding: 4px 0;
  border-bottom: 1px dashed var(--border);
}
.row-card-row .k {
  color: var(--text-dim);
  flex-shrink: 0;
  min-width: 110px;
  max-width: 40%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-card-row .v { word-break: break-all; color: var(--text); }
.row-card-close {
  margin-top: 12px;
  width: 100%;
}
.row-card-overlay .empty-hint { padding: 20px; }

/* 空狀態 */
.empty-hint {
  padding: 40px;
  text-align: center;
  color: var(--text-dim);
}
/* 非表格內容（Obsidian/Trae 瀏覽模式式——主人 2026-08-19 功能⑤） */
.doc-heading { margin: 20px 0 8px; font-weight: 700; line-height: 1.35; }
.doc-heading:first-child { margin-top: 4px; }
h1.doc-heading { font-size: 24px; }
h2.doc-heading { font-size: 20px; }
h3.doc-heading { font-size: 17px; }
h4.doc-heading { font-size: 15px; }
.doc-para { margin: 6px 0; line-height: 1.65; font-size: 14px; word-break: break-word; }
.doc-quote {
  border-left: 3px solid var(--accent-dim);
  background: var(--panel);
  padding: 8px 14px;
  margin: 10px 0;
  border-radius: 0 8px 8px 0;
  color: var(--text);
}
.doc-quote p { margin: 4px 0; line-height: 1.6; font-size: 13px; }
.doc-list { margin: 8px 0 8px 20px; line-height: 1.6; font-size: 14px; }
.doc-list li { padding: 1px 0; }
.doc-code {
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  overflow-x: auto;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.5;
  margin: 10px 0;
}
.doc-code-lang { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
.doc-hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
.doc-figure { margin: 12px 0; }
.doc-figure img { max-width: 100%; border-radius: 8px; display: block; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }
.doc-figure figcaption { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.doc-img-fallback {
  background: var(--panel);
  border: 1px dashed var(--border);
  border-radius: 8px;
  padding: 14px;
  color: var(--text-dim);
  font-size: 12px;
  word-break: break-all;
  line-height: 1.6;
}
.doc-para a, .doc-list a { color: var(--accent); text-decoration: none; }
.doc-para a:hover, .doc-list a:hover { text-decoration: underline; }
.doc-para code, .doc-quote code, .doc-heading code, .doc-list code {
  background: var(--panel2);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 12px;
  font-family: Consolas, "Courier New", monospace;
}

footer {
  padding: 6px 16px;
  font-size: 11px;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  background: var(--panel);
  flex-shrink: 0;
}
</style>
</head>
<body>
<header>
  <h1>📊 MD 表格閱讀器</h1>
  <button id="openBtn" class="primary">打開 md 檔</button>
  <button id="refreshBtn" title="重新整理（非 F5——重讀檔案，保留閱讀狀態）" disabled>🔄 重新整理</button>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown" hidden>
  <span id="fileName"></span>
  <input type="search" id="searchBox" placeholder="搜尋表格內容…（Notion 式過濾）" disabled>
  <select id="searchScope" title="搜尋範圍" disabled>
    <option value="">🔍 全部欄位</option>
  </select>
  <button id="tableBtn" title="表格顯示控制">⚙ 表格</button>
  <div id="tablePanel" class="col-panel" style="top:48px; left:16px; right:auto;"></div>
  <button id="freezeBtn" title="凍結首欄">📌 首欄</button>
  <button id="wrapBtn" title="自動換行開關（想換就換、不想換就截斷）">↔ 換行</button>
  <button id="nonTableBtn" title="顯示/不顯示非表格內容（含圖片；默認不顯示）">📄 內容</button>
  <button id="imageBtn" title="選 md 所在目錄——讓相對路徑圖片能顯示（主人 2026-08-19）" disabled>📁 圖片</button>
  <button id="themeBtn" title="切換深淺色">🌙</button>
  <span id="stats"></span>
</header>
<main>
  <div id="dropZone">
    <div>
      <div style="font-size:28px;margin-bottom:10px;">📄</div>
      把 md 檔拖到這裡<br>
      <span style="font-size:14px;">或點「打開 md 檔」按鈕</span>
    </div>
  </div>
</main>

<script>
"use strict";
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileNameEl = document.getElementById("fileName");
const searchBox = document.getElementById("searchBox");
const searchScope = document.getElementById("searchScope");
const statsEl = document.getElementById("stats");
const freezeBtn = document.getElementById("freezeBtn");
const wrapBtn = document.getElementById("wrapBtn");
const nonTableBtn = document.getElementById("nonTableBtn");
const imageBtn = document.getElementById("imageBtn");
const themeBtn = document.getElementById("themeBtn");
const tableBtn = document.getElementById("tableBtn");
const tablePanel = document.getElementById("tablePanel");

let tables = [];        // 解析出的所有表格 {name, headers, rows}
let blocks = [];        // 解析出的完整區塊序列（含非表格內容——主人 2026-08-19 功能⑤）
let currentFile = "";
let frozen = false;
let sortState = {};     // 每個表格的排序狀態 {tableIdx: {col, dir}}
let viewStates = [];    // 每個表格的視圖狀態 {colOrder: [], hidden: Set()}
let suppressClick = false; // 欄寬拖拽後抑制誤觸發的 click（防止拖完觸發排序）
let hiddenTables = new Set(); // 被隱藏的表格索引
let filterStates = [];        // 每個表格的篩選狀態 {conditions: [{col, op, value}]}（功能①）
// 全局面板（body 級 fixed——顯示不受目標表格大小影響，主人 2026-08-19）
const globalFilterPanel = document.createElement("div");
globalFilterPanel.className = "filter-panel";
document.body.appendChild(globalFilterPanel);

// 表格 idx 的可見欄位（按 colOrder 過濾 hidden）
function visibleCols(idx) {
  const vs = viewStates[idx];
  if (!vs) return [];
  return vs.colOrder.filter(c => !vs.hidden.has(c));
}
function initViewState(t, idx) {
  viewStates[idx] = {
    colOrder: t.headers.map((_, i) => i),
    hidden: new Set(),
    colWidths: {}   // 欄寬狀態（colIndex -> px）——拖欄排序重建時沿用，不洗牌（主人 2026-08-17）
  };
}

// ---------- 主題 ----------
function initTheme() {
  const saved = localStorage.getItem("mdtable-theme");
  if (saved === "light") document.body.setAttribute("data-theme", "light");
}
themeBtn.addEventListener("click", () => {
  const isLight = document.body.getAttribute("data-theme") === "light";
  if (isLight) {
    document.body.removeAttribute("data-theme");
    localStorage.setItem("mdtable-theme", "dark");
    themeBtn.textContent = "🌙";
  } else {
    document.body.setAttribute("data-theme", "light");
    localStorage.setItem("mdtable-theme", "light");
    themeBtn.textContent = "☀️";
  }
});

// ---------- 檔案載入（功能③：非 F5 重新整理需要 FileSystemFileHandle） ----------
const refreshBtn = document.getElementById("refreshBtn");
let currentHandle = null;   // FileSystemFileHandle——「重新整理」靠它重讀最新內容

async function loadFromHandle(handle) {
  try {
    const file = await handle.getFile();
    currentHandle = handle;
    refreshBtn.disabled = false;
    loadFile(file);
  } catch (e) {
    // 權限可能被撤——重新請求
    try {
      const perm = (handle.requestPermission) ? await handle.requestPermission({ mode: "read" }) : "granted";
      if (perm === "granted") {
        const file = await handle.getFile();
        currentHandle = handle;
        refreshBtn.disabled = false;
        loadFile(file);
      }
    } catch (_) {
      currentHandle = null;
      refreshBtn.disabled = true;
    }
  }
}

document.getElementById("openBtn").addEventListener("click", async () => {
  // 優先 File System Access API（拿 handle——重新整理需要）；不可用/取消則 fallback fileInput
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "Markdown 文件", accept: { "text/markdown": [".md", ".markdown", ".txt"] } }],
        multiple: false,
      });
      if (handle && handle.kind === "file") { await loadFromHandle(handle); return; }
    } catch (e) {
      if (e.name === "AbortError") return; // 用戶取消
      // 其他錯誤 → fallback 舊方式
    }
  }
  fileInput.click();
});
fileInput.addEventListener("change", () => {
  const f = fileInput.files[0];

    currentHandle = null;
    refreshBtn.disabled = true;

["dragover", "dragenter"].forEach(ev => {

    e.preventDefault();
    dropZone.classList.add("dragover");
  });
});
["dragleave", "drop"].forEach(ev => {

    dropZone.classList.remove("dragover");
  });
});
dropZone.addEventListener("drop", async e => {
  const f = e.dataTransfer.files[0];
  // 優先拿 FileSystemFileHandle（Chromium——重新整理需要重讀）
  let handle = null;
  try {
    if (e.dataTransfer.items && e.dataTransfer.items[0] && e.dataTransfer.items[0].getAsFileSystemHandle) {
      handle = await e.dataTransfer.items[0].getAsFileSystemHandle();
    }
  } catch (_) { handle = null; }
  if (handle && handle.kind === "file") {
    await loadFromHandle(handle);
  } else if (f) {

    refreshBtn.disabled = true;
    loadFile(f);

});

// 非 F5 重新整理：重讀檔案最新內容，保留閱讀者權力（滾動/篩選/欄寬/排序/視圖）——主人 2026-08-19 功能③
refreshBtn.addEventListener("click", async () => {
  if (!currentHandle) return;
  try {
    const file = await currentHandle.getFile();
    if (!file) return;
    const st = saveReaderState();
    const text = await file.text();
    const doc = parseDocument(text);
    tables = doc.tables;
    blocks = doc.blocks;
    renderAll();
    restoreReaderState(st);
    currentFile = file.name;
    fileNameEl.textContent = "📄 " + file.name;
    statsEl.textContent = tables.length + " 個表格";
    updateStats();
  } catch (e) {
    // 讀取失敗（權限被撤？）——嘗試重新請求權限
    try {
      const perm = (currentHandle.requestPermission) ? await currentHandle.requestPermission({ mode: "read" }) : "granted";
      if (perm === "granted") refreshBtn.click();
    } catch (_) {}
  }
});

// 閱讀者狀態保存/恢復（功能③——「權力不受到挑釁」）
function saveReaderState() {
  return {
    scrollX: window.scrollX,
    scrollY: window.scrollY,
    filters: filterStates.map(s => ({ conditions: (s.conditions || []).map(c => ({ col: c.col, op: c.op, value: c.value })) })),
    views: viewStates.map(v => ({ colOrder: [...v.colOrder], hidden: new Set(v.hidden), colWidths: { ...v.colWidths } })),
    sorts: Object.entries(sortState).map(([k, v]) => ({ key: k, col: v.col, dir: v.dir })),
    hiddenTables: [...hiddenTables],
    search: searchBox.value,
    scope: searchScope.value,
    frozen,
  };
}

function applySortState(idx, col, dir) {
  const t = tables[idx];
  if (!t) return;
  t.rows.forEach((r, i) => { r.__orig = i; });
  t.rows.sort((a, b) => {
    const va = a[col] !== undefined ? a[col] : "";
    const vb = b[col] !== undefined ? b[col] : "";
    const na = parseFloat(va.replace(/[^0-9.\-]/g, ""));
    const nb = parseFloat(vb.replace(/[^0-9.\-]/g, ""));
    let cmp;
    if (!isNaN(na) && !isNaN(nb) && va !== "" && vb !== "") cmp = na - nb;
    else cmp = va.localeCompare(vb, "zh-Hant");
    return dir === "asc" ? cmp : -cmp;
  });
  sortState[`${idx}`] = { col, dir };
}

function restoreReaderState(st) {
  if (!st) return;
  filterStates = st.filters.map(s => ({ conditions: s.conditions || [] }));
  viewStates = st.views.map(v => ({ colOrder: [...v.colOrder], hidden: new Set(v.hidden), colWidths: { ...v.colWidths } }));
  hiddenTables = new Set(st.hiddenTables || []);
  frozen = !!st.frozen;
  // 重應用視圖（欄隱藏/欄寬/欄序——用恢復的 viewStates）
  tables.forEach((_, idx) => { if (viewStates[idx]) rerenderSection(idx); });
  // 重應用排序
  (st.sorts || []).forEach(s => {
    const idx = parseInt(s.key, 10);
    if (tables[idx] && s.col !== undefined) applySortState(idx, s.col, s.dir);
  });
  // 重應用排序箭頭
  Object.entries(sortState).forEach(([k, v]) => {
    const sec = dropZone.querySelector(`.table-section[data-idx="${k}"]`);
    if (!sec) return;
    const ths = sec.querySelectorAll("th");
    ths.forEach(th => { th.querySelector(".arrow").textContent = ""; });
    const th = sec.querySelector(`th[data-col="${v.col}"]`);
    if (th) th.querySelector(".arrow").textContent = v.dir === "asc" ? "▲" : "▼";
  });
  // 恢復搜尋 + 範圍
  searchBox.value = st.search || "";
  searchScope.value = st.scope || "";
  // 恢復表格隱藏
  hiddenTables.forEach(idx => {
    const sec = dropZone.querySelector(`.table-section[data-idx="${idx}"]`);
    if (sec) sec.style.display = "none";
  });
  // 凍結首欄
  document.querySelectorAll("table.md-table").forEach(t => t.classList.toggle("frozen-first", frozen));
  if (frozen) { freezeBtn.style.background = "var(--accent)"; freezeBtn.style.color = "#fff"; }
  else { freezeBtn.style.background = ""; freezeBtn.style.color = ""; }
  applyFilter(searchBox.value);
  updateStats();
  // 恢復滾動位置（權力不受到挑釁）
  window.scrollTo(st.scrollX || 0, st.scrollY || 0);
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    currentFile = file.name;
    fileNameEl.textContent = "📄 " + file.name;
    const doc = parseDocument(reader.result);
    tables = doc.tables;
    blocks = doc.blocks;
    renderAll();
    // 延遲分配欄寬（等表格佈局完成——renderAll 時 dropZone 未佈局，clientWidth=0）
    requestAnimationFrame(() => requestAnimationFrame(() => distributeExcess()));
    searchBox.disabled = false;
    searchScope.disabled = false;
    searchBox.value = "";
    searchScope.value = "";
    fillSearchScope();
    dropZone.classList.add("has-file");
    statsEl.textContent = `${tables.length} 個表格`;
    updateStats();
    imageDirHandle = null;   // 載入新檔——重置目錄 handle
    refreshImageBtn();
  };
  reader.readAsText(file, "utf-8");
}

function updateStats() {
  const shown = tables.length - hiddenTables.size;
  statsEl.textContent = hiddenTables.size > 0
    ? `${shown}/${tables.length} 個表格`
    : `${tables.length} 個表格`;
}

// 填充搜尋範圍（所有表格欄名聯集）
function fillSearchScope() {
  searchScope.innerHTML = '<option value="">🔍 全部欄位</option>';
  const names = [];
  tables.forEach(t => {
    t.headers.forEach((h, ci) => {
      const key = h || `欄 ${ci + 1}`;
      if (!names.includes(key)) names.push(key);
    });
  });
  names.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n;
    opt.textContent = "▸ " + n;
    searchScope.appendChild(opt);
  });
}

// 某欄名在表格 idx 中的原始欄索引（沒有就 -1）
function colIndexByName(idx, name) {
  const t = tables[idx];
  for (let i = 0; i < t.headers.length; i++) {
    if ((t.headers[i] || `欄 ${i + 1}`) === name) return i;
  }
  return -1;
}

// ---------- Markdown 文件解析（表格 + 非表格區塊——主人 2026-08-19 功能⑤） ----------
function parseDocument(text) {
  const lines = text.split(/\r?\n/);
  const blocks = [];   // 完整區塊序列（h/quote/p/list/code/hr/img/table）
  const tables = [];   // 表格數據 {name, headers, rows}
  let i = 0;
  let tableIdx = 0;

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();
    if (isTableRow(line)) {
      // 找最近的標題（往前找 # 標題，最多 5 行）
      let name = `表格 ${++tableIdx}`;
      for (let j = i - 1; j >= Math.max(0, i - 6); j--) {
        const m = lines[j].match(/^#{1,6}\s+(.+?)\s*$/);
        if (m) { name = m[1].trim(); break; }
        if (lines[j].trim() !== "") break;
      }
      const rows = [];
      while (i < lines.length && isTableRow(lines[i])) {
        rows.push(parseTableRow(lines[i]));
        i++;
      }
      if (rows.length >= 2 && isSeparatorRow(rows[1])) {
        const t = {
          name,
          headers: rows[0],
          rows: rows.slice(2).filter(r => r.some(c => c.trim() !== ""))
        };
        tables.push(t);
        blocks.push({ type: "table", tableIdx: tables.length - 1 });
      }
    } else if (trimmed === "") {
      i++;
    } else if (/^#{1,6}\s+/.test(trimmed)) {
      const m = trimmed.match(/^(#{1,6})\s+(.*)$/);
      blocks.push({ type: "h", level: m[1].length, text: m[2].trim() });
      i++;
    } else if (/^```/.test(trimmed)) {
      const lang = trimmed.replace(/^```/, "").trim();
      const codeLines = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) {
        codeLines.push(lines[i]);
        i++;
      }
      i++;  // 跳過結束 ```
      blocks.push({ type: "code", lang, code: codeLines.join("\n") });
    } else if (/^>/.test(trimmed)) {
      const quoteLines = [];
      while (i < lines.length && /^>/.test(lines[i].trim())) {
        quoteLines.push(lines[i].trim().replace(/^>\s?/, ""));
        i++;
      }
      blocks.push({ type: "quote", text: quoteLines.join("\n") });
    } else if (/^(-{3,}|\*{3,})$/.test(trimmed)) {
      blocks.push({ type: "hr" });
      i++;
    } else if (/^[-*]\s+/.test(trimmed)) {
      const items = [];
      while (i < lines.length && /^[-*]\s+/.test(lines[i].trim())) {
        items.push(lines[i].trim().replace(/^[-*]\s+/, ""));
        i++;
      }
      blocks.push({ type: "list", items });
    } else if (/^!\[[^\]]*\]\([^)]*\)/.test(trimmed)) {
      const m = trimmed.match(/^!\[([^\]]*)\]\(([^)]*)\)/);
      blocks.push({ type: "img", alt: m[1], src: m[2], rest: trimmed.slice(m[0].length) });
      i++;
    } else {
      blocks.push({ type: "p", text: trimmed });
      i++;
    }
  }
  return { blocks, tables };
}

function isTableRow(line) {
  return /^\s*\|.*\|\s*$/.test(line) && line.includes("|");
}
function parseTableRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map(c => c.trim());
}
function isSeparatorRow(row) {
  return row.length > 0 && row.every(c => /^:?-{2,}:?$/.test(c.replace(/\s/g, "")));
}

// ---------- 渲染 ----------
function renderAll() {
  dropZone.innerHTML = "";
  document.body.style.minWidth = "";   // 重置拖寬撐開的 body（載入新檔）
  sortState = {};
  viewStates = [];
  hiddenTables.clear();
  filterStates = [];
  // 按區塊序列渲染（功能⑤：顯示非表格內容時，非表格區塊按原順序穿插）
  if (showNonTable) {
    blocks.forEach(block => {
      if (block.type === "table") {
        renderTableSection(block.tableIdx);
      } else {
        dropZone.appendChild(renderBlock(block));
      }
    });
  } else {
    tables.forEach((_, idx) => renderTableSection(idx));
  }
  // 應用表格隱藏
  hiddenTables.forEach(idx => {
    const sec = dropZone.querySelector(`.table-section[data-idx="${idx}"]`);
    if (sec) sec.style.display = "none";
  });
  updateStats();
  applyFilter("");
  distributeExcess();
}

// ---------- 非表格內容渲染（Obsidian/Trae 瀏覽模式式——主人 2026-08-19 功能⑤） ----------
let imageDirHandle = null;   // 「📁 圖片」選的目錄 handle（session 內有效——主人 2026-08-19：對人不是代價）
function isRelativePath(src) {
  const s = src.trim();
  if (/^https?:\/\//i.test(s)) return false;
  if (/^data:/i.test(s)) return false;
  if (/^file:\/\//i.test(s)) return false;
  if (/^[a-zA-Z]:[\\/]/.test(s)) return false;  // Windows 絕對路徑 C:\...
  if (/^\//.test(s)) return false;              // 絕對路徑 /xxx
  return true;
}
async function resolveDirImage(relPath) {
  if (!imageDirHandle) return null;
  try {
    const clean = relPath.replace(/^\.\//, "").replace(/\\/g, "/");
    const fh = await imageDirHandle.getFileHandle(clean);
    const file = await fh.getFile();
    return URL.createObjectURL(file);
  } catch (e) {
    return null;
  }
}
function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function inlineMarkdown(text) {
  let s = text.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  s = s.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderBlock(block) {
  switch (block.type) {
    case "h": {
      const el = document.createElement(`h${Math.min(block.level, 4)}`);
      el.className = "doc-heading";
      el.innerHTML = inlineMarkdown(block.text);
      return el;
    }
    case "p": {
      const el = document.createElement("p");
      el.className = "doc-para";
      el.innerHTML = inlineMarkdown(block.text);
      return el;
    }
    case "quote": {
      const el = document.createElement("blockquote");
      el.className = "doc-quote";
      block.text.split("\n").forEach(ln => {
        const p = document.createElement("p");
        p.innerHTML = inlineMarkdown(ln);
        el.appendChild(p);
      });
      return el;
    }
    case "list": {
      const el = document.createElement("ul");
      el.className = "doc-list";
      block.items.forEach(it => {
        const li = document.createElement("li");
        li.innerHTML = inlineMarkdown(it);
        el.appendChild(li);
      });
      return el;
    }
    case "code": {
      const el = document.createElement("pre");
      el.className = "doc-code";
      if (block.lang) {
        const la = document.createElement("div");
        la.className = "doc-code-lang";
        la.textContent = block.lang;
        el.appendChild(la);
      }
      const code = document.createElement("code");
      code.textContent = block.code;
      el.appendChild(code);
      return el;
    }
    case "hr": {
      const el = document.createElement("hr");
      el.className = "doc-hr";
      return el;
    }
    case "img": {
      const wrap = document.createElement("figure");
      wrap.className = "doc-figure";
      const img = document.createElement("img");
      const src = block.src.trim();
      img.alt = block.alt || "圖片";
      img.loading = "lazy";
      const showFallback = () => {
        // 圖片無法載入（無目錄 handle 的相對路徑等）——顯示 alt + 路徑提示
        // 用 wrap.innerHTML（img 可能未插入 DOM——outerHTML 對 detached 元素無效）
        wrap.innerHTML = `<div class="doc-img-fallback">🖼 ${escapeHtml(block.alt || "圖片")}<br><span>${escapeHtml(block.src)}</span></div>`;
      };
      img.addEventListener("error", showFallback);
      if (isRelativePath(src)) {
        // 相對路徑圖片——有目錄 handle 就讀，沒有就 fallback（主人 2026-08-19「📁 圖片」）
        if (imageDirHandle) {
          resolveDirImage(src).then(blobUrl => {
            if (blobUrl) img.src = blobUrl;
            else showFallback();
          });
        } else {
          showFallback();
        }
      } else {
        img.src = src;
      }
      wrap.appendChild(img);
      if (block.alt) {
        const fig = document.createElement("figcaption");
        fig.textContent = block.alt;
        wrap.appendChild(fig);
      }
      if (block.rest) {
        const p = document.createElement("p");
        p.className = "doc-para";
        p.innerHTML = inlineMarkdown(block.rest);
        wrap.appendChild(p);
      }
      return wrap;
    }
    default: {
      const el = document.createElement("div");
      el.className = "doc-para";
      return el;
    }
  }
}

// 渲染單個表格區（section——現有表格功能全部保留）
function renderTableSection(idx) {
  const t = tables[idx];
  initViewState(t, idx);
  filterStates[idx] = { conditions: [] };
  const section = document.createElement("div");
    section.className = "table-section";
    section.dataset.idx = idx;
    section.style.position = "relative";
    // 單表格時填滿視窗（高胖帥）；多表格時自然高度（小表格不佔滿留白）
    if (tables.length === 1) section.classList.add("single");

    const toolbar = document.createElement("div");
    toolbar.className = "table-toolbar";
    const title = document.createElement("span");
    title.className = "table-title";
    title.textContent = t.name;
    const rowsInfo = document.createElement("span");
    rowsInfo.className = "table-rows";
    rowsInfo.textContent = `${t.headers.length} 欄 × ${t.rows.length} 行`;
    const spacer = document.createElement("span");
    spacer.className = "spacer";
    const viewBtn = document.createElement("button");
    viewBtn.textContent = "表格";
    viewBtn.className = "view-btn active";
    viewBtn.dataset.view = "table";
    const cardBtn = document.createElement("button");
    cardBtn.textContent = "卡片";
    cardBtn.className = "view-btn";
    cardBtn.dataset.view = "card";
    viewBtn.addEventListener("click", () => setView(idx, "table", viewBtn, cardBtn));
    cardBtn.addEventListener("click", () => setView(idx, "card", viewBtn, cardBtn));
    // 篩選按鈕 + 全局面板（功能① Notion 式——面板 body 級，不隨表格縮小）
    const filterBtn = document.createElement("button");
    filterBtn.textContent = "🔍 篩選";
    filterBtn.className = "filter-btn";
    filterBtn.title = "篩選器（Notion 式）";
    filterBtn.addEventListener("click", e => {
      e.stopPropagation();
      openFilterPanel(idx, e);
    });
    // 欄位控制按鈕 + 面板
    const colBtn = document.createElement("button");
    colBtn.textContent = "⚙ 欄位";
    const colPanel = document.createElement("div");
    colPanel.className = "col-panel";
    colBtn.addEventListener("click", e => {
      e.stopPropagation();
      buildColPanel(idx, colPanel);
      colPanel.classList.toggle("show");
    });
    toolbar.append(title, rowsInfo, spacer, viewBtn, cardBtn, filterBtn, colBtn);
    section.appendChild(toolbar);
    section.appendChild(colPanel);
    // 點外面關面板（col-panel 局部；filter-panel 由 document 監聽關）
    section.addEventListener("click", e => {
      if (!e.target.closest(".col-panel") && e.target !== colBtn) {
        colPanel.classList.remove("show");
      }
    });

    // 表格視圖
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    wrap.appendChild(buildTable(t, idx));
    section.appendChild(wrap);

    // 卡片視圖
    const cards = document.createElement("div");
    cards.className = "card-view";
    cards.appendChild(buildCards(t, idx));
    section.appendChild(cards);

    dropZone.appendChild(section);
}

// 把表格多餘寬度分配給欄 style（欄 style 總和 = 表格寬）——拖寬時純加法，右欄分毫未動（主人 2026-08-17）
function distributeExcess() {
  document.querySelectorAll(".md-table").forEach((tbl, ti) => {
    const ths = [...tbl.querySelectorAll("th")].filter(t => t.style.display !== "none");
    if (!ths.length) return;
    const styleSum = ths.reduce((s, t) => {
      const w = t.style.width;
      return s + (w && w.endsWith("px") ? parseFloat(w) : 0);
    }, 0);
    const avail = tbl.clientWidth;
    if (avail > styleSum && styleSum > 0) {
      const last = ths[ths.length - 1];
      const lastW = parseFloat(last.style.width) || 0;
      last.style.width = (lastW + (avail - styleSum)) + "px";
    }
    // 保存每欄實際寬度（colWidths）——拖欄排序重建時沿用，不洗牌
    const sec = dropZone.querySelector(`.table-section[data-idx="${ti}"]`);
    if (sec && viewStates[ti]) {
      ths.forEach(t => {
        const ci = parseInt(t.dataset.col, 10);
        const sw = t.style.width;
        if (!isNaN(ci) && sw && sw.endsWith("px")) {
          viewStates[ti].colWidths[ci] = parseFloat(sw);
        }
      });
    }
  });
}

function buildTable(t, idx) {
  const vis = visibleCols(idx);
  const table = document.createElement("table");
  table.className = "md-table";
  if (frozen) table.classList.add("frozen-first");

  const thead = document.createElement("thead");
  const tr = document.createElement("tr");
  vis.forEach((ci, pos) => {
    const h = t.headers[ci] !== undefined ? t.headers[ci] : `欄 ${ci + 1}`;
    const th = document.createElement("th");
    th.dataset.col = ci;
    th.dataset.pos = pos;
    th.textContent = h;
    th.title = h;
    // 智慧欄寬：按表頭文字長度給初始權重（短欄窄、長欄寬）——但有保存值（閱讀者調過）則沿用，不洗牌
    const savedW = viewStates[idx].colWidths[ci];
    const w = savedW || Math.min(220, Math.max(64, h.length * 15 + 26));
    th.style.width = w + "px";
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    th.appendChild(arrow);
    th.addEventListener("click", () => {
      if (suppressClick) return; // 欄寬拖拽結束後的 click 不觸發排序
      sortTable(idx, ci, th);
    });
    // 欄寬拖拽
    const resizer = document.createElement("span");
    resizer.className = "resizer";
    resizer.addEventListener("mousedown", e => startResize(e, th));
    th.appendChild(resizer);
    // 欄拖拽排序（HTML5 DnD）
    th.draggable = true;
    th.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/plain", String(ci));
      th.classList.add("dragging");
    });
    th.addEventListener("dragend", () => {
      th.classList.remove("dragging");
      table.querySelectorAll("th").forEach(x => x.classList.remove("drag-over"));
    });
    th.addEventListener("dragover", e => {
      e.preventDefault();
      th.classList.add("drag-over");
    });
    th.addEventListener("dragleave", () => th.classList.remove("drag-over"));
    th.addEventListener("drop", e => {
      e.preventDefault();
      th.classList.remove("drag-over");
      const srcCol = parseInt(e.dataTransfer.getData("text/plain"), 10);
      if (isNaN(srcCol) || srcCol === ci) return;
      reorderColumn(idx, srcCol, ci);
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  t.rows.forEach(row => {
    const r = document.createElement("tr");
    r.style.cursor = "pointer";
    r.title = "點擊彈出卡片";
    r.addEventListener("click", () => openRowCard(t, idx, row));  // 功能④
    vis.forEach(ci => {
      const td = document.createElement("td");
      const v = row[ci] !== undefined ? row[ci] : "";
      td.textContent = v;
      td.title = v;
      td.dataset.col = ci;
      r.appendChild(td);
    });
    tbody.appendChild(r);
  });
  table.appendChild(tbody);
  return table;
}

// 欄位重排（只改視圖，不動 md 原檔）
function reorderColumn(idx, srcCol, targetCol) {
  const vs = viewStates[idx];
  const from = vs.colOrder.indexOf(srcCol);
  const to = vs.colOrder.indexOf(targetCol);
  if (from < 0 || to < 0 || from === to) return;
  const [moved] = vs.colOrder.splice(from, 1);
  vs.colOrder.splice(to, 0, moved);
  rerenderSection(idx);
}

// 重建某個表格區（表格 + 卡片 + 過濾）
function rerenderSection(idx) {
  const t = tables[idx];
  const section = dropZone.querySelector(`.table-section[data-idx="${idx}"]`);
  const isCardView = section.querySelector(".card-view").classList.contains("show");
  const wrap = section.querySelector(".table-wrap");
  wrap.innerHTML = "";
  wrap.appendChild(buildTable(t, idx));
  const cards = section.querySelector(".card-view");
  cards.innerHTML = "";
  cards.appendChild(buildCards(t, idx));
  // 保持視圖狀態
  wrap.classList.toggle("hide", isCardView);
  cards.classList.toggle("show", isCardView);
  const info = section.querySelector(".table-rows");
  const visCount = visibleCols(idx).length;
  info.textContent = `${visCount} 欄 × ${t.rows.length} 行`;
  // 恢復表格總寬（閱讀者拖寬過的狀態保持——排序不洗牌總寬）
  const t2 = wrap.querySelector("table.md-table");
  if (t2) {
    const total2 = [...t2.querySelectorAll("th")].reduce((s, th2) => {
      const sw = th2.style.width;
      return s + (sw && sw.endsWith("px") ? parseFloat(sw) : 0);
    }, 0);
    t2.style.width = total2 + "px";
    t2.style.minWidth = "0";
    if (total2 > (parseInt(document.body.style.minWidth) || 0)) {
      document.body.style.minWidth = (total2 + 40) + "px";
      const ww = t2.closest(".table-wrap");
      if (ww) ww.style.minWidth = (total2 + 40) + "px";
    }
  }
  applyFilter(searchBox.value);
}

// ---------- 篩選器（Notion 式，功能①） ----------
function positionFilterPanel(anchorTop) {
  // 固定左面（主人 2026-08-19：放中間或左面、不要貼右）——右緣仍 clamp 進視口
  const pw = globalFilterPanel.offsetWidth;
  let left = 16;
  if (left + pw > window.innerWidth - 8) {
    left = Math.max(8, window.innerWidth - pw - 8);
  }
  globalFilterPanel.style.top = anchorTop + "px";
  globalFilterPanel.style.left = left + "px";
}
// 重建後重新定位（添加/刪除/清除讓面板變寬變高——保持完整可見）
function repositionFilterPanel() {
  if (!globalFilterPanel.classList.contains("show")) return;
  globalFilterPanel.style.visibility = "hidden";
  positionFilterPanel(parseFloat(globalFilterPanel.style.top) || 48);
  globalFilterPanel.style.visibility = "visible";
}
function openFilterPanel(idx, ev) {
  buildFilterPanel(idx, globalFilterPanel);
  globalFilterPanel.dataset.idx = String(idx);  // 記錄面板屬於哪個表格（計數同步用）
  const rect = ev.currentTarget.getBoundingClientRect();
  // 先隱形顯示 → 測真實寬度 → 定位 → 再顯形（避免 display:none 時 offsetWidth=0 導致右溢）
  globalFilterPanel.style.visibility = "hidden";
  globalFilterPanel.classList.add("show");
  positionFilterPanel(rect.bottom + 4);
  globalFilterPanel.style.visibility = "visible";
}
// 點外面關閉全局面板（filterBtn 的 click 已 stopPropagation——不會誤關）
document.addEventListener("click", e => {
  if (!e.target.closest(".filter-panel") && !e.target.closest(".filter-btn")) {
    globalFilterPanel.classList.remove("show");
  }
});

function matchCond(cellText, op, value) {
  if (!value || !value.trim()) return true; // 值空 = 條件不生效
  const v = value.trim();
  const t = (cellText || "").toString();
  switch (op) {
    case "eq": return t === v;
    case "neq": return t !== v;
    case "contains": return t.includes(v);
    case "ncontains": return !t.includes(v);
    case "in": {
      const vals = v.split(/[、,，]/).map(s => s.trim()).filter(Boolean);
      return vals.length === 0 || vals.some(x => t === x);
    }
    case "nin": {
      const vals = v.split(/[、,，]/).map(s => s.trim()).filter(Boolean);
      return vals.length === 0 || !vals.some(x => t === x);
    }
    default: return true;
  }
}

function countVisibleRows(idx) {
  const section = dropZone.querySelector(`.table-section[data-idx="${idx}"]`);
  if (!section) return 0;
  return [...section.querySelectorAll("tbody tr")].filter(tr => tr.style.display !== "none").length;
}

// ---------- 排序 ----------
function sortTable(idx, col, th) {
  const t = tables[idx];
  const key = `${idx}`;
  const cur = sortState[key];
  let dir;
  if (!cur || cur.col !== col) dir = "asc";
  else if (cur.dir === "asc") dir = "desc";
  else dir = null;

  if (dir === null) {
    // 還原原序
    t.rows.sort((a, b) => a.__orig - b.__orig);
    delete sortState[key];
  } else {
    if (!cur || cur.col !== col) {
      t.rows.forEach((r, i) => { r.__orig = i; });
    }
    t.rows.sort((a, b) => {
      const va = a[col] !== undefined ? a[col] : "";
      const vb = b[col] !== undefined ? b[col] : "";
      const na = parseFloat(va.replace(/[^0-9.\-]/g, ""));
      const nb = parseFloat(vb.replace(/[^0-9.\-]/g, ""));
      let cmp;
      if (!isNaN(na) && !isNaN(nb) && va !== "" && vb !== "") cmp = na - nb;
      else cmp = va.localeCompare(vb, "zh-Hant");
      return dir === "asc" ? cmp : -cmp;
    });
    sortState[key] = { col, dir };
  }

  // 更新箭頭
  const section = dropZone.querySelector(`.table-section[data-idx="${idx}"]`);
  const ths = section.querySelectorAll("th");
  ths.forEach(th2 => { th2.querySelector(".arrow").textContent = ""; });
  if (dir) th.querySelector(".arrow").textContent = dir === "asc" ? "▲" : "▼";

  // 重建 tbody
  const table = section.querySelector("table.md-table");
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";
  const vis = visibleCols(idx);
  t.rows.forEach(row => {
    const r = document.createElement("tr");
    vis.forEach(ci => {
      const td = document.createElement("td");
      const v = row[ci] !== undefined ? row[ci] : "";
      td.textContent = v;
      td.title = v;
      td.dataset.col = ci;
      r.appendChild(td);
    });
    tbody.appendChild(r);
  });
  applyFilter(searchBox.value);
}

// ---------- 欄寬拖拽 ----------
function startResize(e, th) {
  e.preventDefault();
  e.stopPropagation();
  th.draggable = false; // 拖寬期間關閉欄拖拽，避免搶事件
  suppressClick = true; // 拖寬期間及結束後抑制 click，避免誤觸發排序
  const startX = e.clientX;
  const startW = th.offsetWidth;
  // 拖寬開始：解除 min-width 鎖（表格可突破容器）
  const tbl = th.closest("table");
  tbl.style.minWidth = "0";
  function onMove(ev) {
    const w = Math.max(40, startW + (ev.clientX - startX));
    th.style.width = w + "px";
    th.style.minWidth = w + "px";
    // 表格總寬 = 所有欄 style.width 總和（fixed 嚴格分配，純加法——右欄分毫未動）
    // 注意：不能讀 offsetWidth——fixed 表格中欄寬受表格寬影響，會正回饋爆炸（實測 100 萬 px）
    const total = [...tbl.querySelectorAll("th")].reduce((s, t) => {
        const sw = t.style.width;
        return s + (sw && sw.endsWith("px") ? parseFloat(sw) : t.offsetWidth);
    }, 0);
    tbl.style.width = total + "px";
    // 撐開容器 + body（overflow:visible 溢出可見但不撐開視口滾動範圍——必須設 body min-width）
    // +40px 餘量：滾到最右時最右欄右緣不貼視口邊緣，resizer 才抓得到（主人 2026-08-17 缺憾）
    const wwrap = tbl.closest(".table-wrap");
    if (wwrap) wwrap.style.minWidth = (total + 40) + "px";
    document.body.style.minWidth = (total + 40) + "px";
  }
  function onUp() {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    document.body.style.cursor = "";
    th.draggable = true;
    // 拖寬結束：保存目標欄新寬（排序重建沿用，不洗牌）
    const ci = parseInt(th.dataset.col, 10);
    const section = th.closest(".table-section");
    const tIdx = section ? parseInt(section.dataset.idx, 10) : -1;
    if (!isNaN(ci) && tIdx >= 0 && viewStates[tIdx]) {
      viewStates[tIdx].colWidths[ci] = parseFloat(th.style.width) || th.offsetWidth;
    }
    setTimeout(() => { suppressClick = false; }, 120);
  }
  document.body.style.cursor = "col-resize";
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

// ---------- 過濾（Notion 式） ----------
searchBox.addEventListener("input", () => applyFilter(searchBox.value));
searchScope.addEventListener("change", () => applyFilter(searchBox.value));

function applyFilter(q) {
  q = (q || "").trim().toLowerCase();
  const scope = searchScope.value; // "" = 全部欄位
  const sections = dropZone.querySelectorAll(".table-section");
  sections.forEach((section, idx) => {
    const rowsEl = section.querySelectorAll("tbody tr");
    const colIdx = scope ? colIndexByName(idx, scope) : -1;
    const fcond = (filterStates[idx] && filterStates[idx].conditions) || [];
    let visible = 0;
    rowsEl.forEach(tr => {
      let text;
      if (colIdx >= 0) {
        const td = tr.querySelector(`td[data-col="${colIdx}"]`);
        text = td ? td.textContent.toLowerCase() : "";
      } else {
        text = tr.textContent.toLowerCase();
      }
      const searchOk = q === "" || text.includes(q);
      // 篩選條件（全部 AND——功能①）
      const filterOk = fcond.every(c => {
        const td = tr.querySelector(`td[data-col="${c.col}"]`);
        return matchCond(td ? td.textContent : "", c.op, c.value);
      });
      const show = searchOk && filterOk;
      tr.style.display = show ? "" : "none";
      if (show) visible++;
    });
    // 卡片視圖也過濾（搜尋 + 篩選）
    const cards = section.querySelectorAll(".card");
    let cardVisible = 0;
    cards.forEach(c => {
      const row = JSON.parse(c.dataset.row || "[]");
      let text;
      if (colIdx >= 0) {
        text = (row[colIdx] !== undefined ? row[colIdx] : "").toString().toLowerCase();
      } else {
        text = row.join(" ").toLowerCase();
      }
      const searchOk = q === "" || text.includes(q);
      const filterOk = fcond.every(cd => {
        const v = row[cd.col] !== undefined ? row[cd.col] : "";
        return matchCond(v.toString(), cd.op, cd.value);
      });
      const show = searchOk && filterOk;
      c.style.display = show ? "" : "none";
      if (show) cardVisible++;
    });
    const info = section.querySelector(".table-rows");
    const total = tables[idx].rows.length;
    const visCount = visibleCols(idx).length;
    const filtering = q !== "" || fcond.length > 0;
    info.textContent = filtering
      ? `${visCount} 欄 × ${visible}/${total} 行`
      : `${visCount} 欄 × ${total} 行`;
    // 同步篩選面板的計數（若開著——面板是 body 級全局的）
    if (globalFilterPanel.classList.contains("show") && globalFilterPanel.dataset.idx === String(idx)) {
      const fp = globalFilterPanel.querySelector(".filter-count");
      if (fp) fp.textContent = "顯示 " + visible + "/" + total;
    }
  });
}

// ---------- 凍結首欄 ----------
freezeBtn.addEventListener("click", () => {
  frozen = !frozen;
  freezeBtn.style.background = frozen ? "var(--accent)" : "";
  freezeBtn.style.color = frozen ? "#fff" : "";
  document.querySelectorAll("table.md-table").forEach(t => {
    t.classList.toggle("frozen-first", frozen);
  });
});

// ---------- 自動換行開關（功能②補充——主人 2026-08-19：閱讀者想換就換、不想換就截斷；默認非自動換行） ----------
let wrapEnabled = localStorage.getItem("mdtable-wrap") === "on";
function applyWrap() {
  document.body.classList.toggle("wrap-off", !wrapEnabled);
  wrapBtn.style.background = wrapEnabled ? "var(--accent)" : "";
  wrapBtn.style.color = wrapEnabled ? "#fff" : "";
  wrapBtn.textContent = wrapEnabled ? "↔ 換行開" : "↔ 換行關";
}
wrapBtn.addEventListener("click", () => {
  wrapEnabled = !wrapEnabled;
  localStorage.setItem("mdtable-wrap", wrapEnabled ? "on" : "off");
  applyWrap();
});
applyWrap();

// ---------- 非表格內容開關（功能⑤——主人 2026-08-19：顯示含圖片；默認不顯示） ----------
let showNonTable = localStorage.getItem("mdtable-nontable") === "on";
function applyNonTable() {
  nonTableBtn.style.background = showNonTable ? "var(--accent)" : "";
  nonTableBtn.style.color = showNonTable ? "#fff" : "";
  nonTableBtn.textContent = showNonTable ? "📄 內容開" : "📄 內容";
}
nonTableBtn.addEventListener("click", () => {
  showNonTable = !showNonTable;
  localStorage.setItem("mdtable-nontable", showNonTable ? "on" : "off");
  renderAll();
  applyNonTable();
});
applyNonTable();

// ---------- 圖片目錄（主人 2026-08-19：「📁 圖片」——選 md 所在目錄，讓相對路徑圖片能顯示） ----------
function refreshImageBtn() {
  const hasRelImg = blocks.some(b => b.type === "img" && isRelativePath(b.src));
  imageBtn.disabled = !hasRelImg;
  imageBtn.textContent = imageDirHandle ? "📁 圖片✓" : "📁 圖片";
  imageBtn.style.background = imageDirHandle ? "var(--accent)" : "";
  imageBtn.style.color = imageDirHandle ? "#fff" : "";
  imageBtn.title = imageDirHandle
    ? "已選目錄——相對路徑圖片可顯示（點擊可換目錄）"
    : "選 md 所在目錄——讓相對路徑圖片能顯示";
}
imageBtn.addEventListener("click", async () => {
  if (!window.showDirectoryPicker) return;
  try {
    const handle = await window.showDirectoryPicker();
    imageDirHandle = handle;
    refreshImageBtn();
    // 重渲染（保留閱讀者狀態——圖片重新解析）
    const st = saveReaderState();
    renderAll();
    restoreReaderState(st);
  } catch (e) {
    // 用戶取消——不動作
  }
});

initTheme();
</script>
